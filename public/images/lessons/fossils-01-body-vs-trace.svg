<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 500' role='img'><title>Body fossils versus trace fossils gallery</title><desc>Four body fossils (ammonite, tooth, fern, petrified wood) beside four trace fossils (tracks, burrows, bite marks, coprolite).</desc><rect x='0' y='0' width='800' height='500' fill='#fbf8f3'/><text x='400' y='45' text-anchor='middle' font-size='22' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Two kinds of fossils</text><text x='215' y='78' text-anchor='middle' font-size='16' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>BODY: parts of the organism</text><text x='585' y='78' text-anchor='middle' font-size='16' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>TRACE: signs of activity</text><rect x='20' y='95' width='370' height='88' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='205' y='163' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>coiled ammonite shell</text><rect x='410' y='95' width='370' height='88' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='595' y='163' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>3-toed trackway</text><rect x='20' y='191' width='370' height='88' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='205' y='259' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>serrated dinosaur tooth</text><rect x='410' y='191' width='370' height='88' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='595' y='259' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>branching burrows</t