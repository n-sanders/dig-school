<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 470' role='img'><title>Sprawling reptile posture versus upright dinosaur posture</title><desc>Front-view pelvis comparison: sideways sprawling legs with a wide trail against pillar legs with a narrow trail.</desc><rect x='0' y='0' width='800' height='470' fill='#fbf8f3'/><rect x='20' y='20' width='370' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='205.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Sprawling: lizard / crocodile</text><ellipse cx='205' cy='180' rx='60' ry='30' fill='#8a9a5b' stroke='#3e4a2e' stroke-width='2.5'/><line x1='165' y1='190' x2='95' y2='250' stroke='#3e4a2e' stroke-width='12' stroke-linecap='round'/><line x1='95' y1='250' x2='95' y2='300' stroke='#3e4a2e' stroke-width='10' stroke-linecap='round'/><line x1='245' y1='190' x2='315' y2='250' stroke='#3e4a2e' stroke-width='12' stroke-linecap='round'/><line x1='315' y1='250' x2='315' y2='300' stroke='#3e4a2e' stroke-width='10' stroke-linecap='round'/><text x='205' y='340' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>legs out to the sides,</text><text x='205' y='362' text-anchor='middle' font-size='14' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>wide trackway</text><rect x='410' y='20' width='370' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='595.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Upright: dinosaur</text><ellipse cx='595' cy='170' rx='55' ry='28' fill='#c9a87c' stroke='#5f4630' stroke-width='2.5'/><circle cx='560' cy='170' r='12' fill='none' stroke='#b4561f' stroke-width='3'/><circle cx='630' cy='170' r='12' fill='none' stroke='#b4561f' stroke-width='3'/><line x1='570' y1='190' x2='570' y2='300' stroke='#5f4630' stroke-width='12' stroke-linecap='round'/><line x1='620' y1='190' x2='620' y2='300' stroke='#5f4630' stroke-width='12' stroke-linecap='round'/><text x='595' y='340' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>legs straight under body,</text><text x='595' y='362' text-anchor='middle' font-size='14' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>narrow straight trail</text><text x='400' y='452' text-anchor='middle' font-size='15' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Open hip socket + inward-angled femur = pillar legs under the body.</text></svg>