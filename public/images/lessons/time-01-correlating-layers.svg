<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 470' role='img'><title>Matching rock layers and fossils across two canyon walls</title><desc>Two canyon outcrops with four matching layers each, linked by dashed correlation lines across the valley.</desc><rect x='0' y='0' width='800' height='470' fill='#fbf8f3'/><rect x='20' y='20' width='350' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='195.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>West canyon wall</text><rect x='110' y='120' width='290' height='60' rx='8' fill='#cfd8c9' stroke='#8a7a68' stroke-width='1.5' /><rect x='110' y='180' width='290' height='70' rx='8' fill='#c96f4a' stroke='#8a7a68' stroke-width='1.5' /><rect x='110' y='250' width='290' height='80' rx='8' fill='#d9c39a' stroke='#8a7a68' stroke-width='1.5' /><rect x='110' y='330' width='290' height='60' rx='8' fill='#d8cfc4' stroke='#8a7a68' stroke-width='1.5' /><text x='255' y='155' text-anchor='middle' font-size='12' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>4: gravel + mammoth molar</text><text x='255' y='220' text-anchor='middle' font-size='12' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>3: sandstone + dinosaur bones</text><text x='255' y='292' text-anchor='middle' font-size='12' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>2: red shale + fern + tracks</text><text x='255' y='362' text-anchor='middle' font-size='12' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>1: limestone + trilobites</text><rect x='430' y='20' width='350' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='605.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>East canyon wall</text><rect x='460' y='170' width='290' height='60' rx='8' fill='#cfd8c9' stroke='#8a7a68' stroke-width='1.5' /><rect x='460' y='230' width='290' height='80' rx='8' fill='#d9c39a' stroke='#8a7a68' stroke-width='1.5' /><rect x='460' y='310' width='290' height='70' rx='8' fill='#c96f4a' stroke='#8a7a68' stroke-width='1.5' /><rect x='460' y='380' width='290' height='40' rx='8' fill='#8a9a8b' stroke='#8a7a68' stroke-width='1.5' /><text x='605' y='205' text-anchor='middle' font-size='12' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>4: gravel + mammoth molar</text><text x='605' y='272' text-anchor='middle' font-size='12' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>3: sandstone + dinosaur bones</text><text x='605' y='348' text-anchor='middle' font-size='12' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>2: red shale + fern + tracks</text><line x1='400' y1='150' x2='460' y2='200' stroke='#b4561f' stroke-width='2.5' stroke-dasharray='9 6'/><line x1='400' y1='215' x2='460' y2='270' stroke='#b4561f' stroke-width='2.5' stroke-dasharray='9 6'/><line x1='400' y1='290' x2='460' y2='345' stroke='#b4561f' stroke-width='2.5' stroke-dasharray='9 6'/><text x='430' y='452' text-anchor='middle' font-size='15' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Match rock type + order + fossils to link the two walls into one timeline.</text></svg>