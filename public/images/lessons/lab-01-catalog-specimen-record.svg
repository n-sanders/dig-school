<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 440' role='img'><title>Cataloged specimen and its linked archive records</title><desc>Numbered jawbone in a padded cradle linked to its label card, field records, and rock-layer record.</desc><rect x='0' y='0' width='800' height='440' fill='#fbf8f3'/><rect x='20' y='20' width='360' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='200.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Cataloged jawbone</text><rect x='50' y='130' width='300' height='120' rx='8' fill='#e9e2d6' stroke='#8a7a68' stroke-width='1.5' /><ellipse cx='200' cy='170' rx='100' ry='26' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><line x1='150' y1='150' x2='150' y2='190' stroke='#7a5c3e' stroke-width='2'/><line x1='175' y1='150' x2='175' y2='190' stroke='#7a5c3e' stroke-width='2'/><line x1='200' y1='150' x2='200' y2='190' stroke='#7a5c3e' stroke-width='2'/><line x1='225' y1='150' x2='225' y2='190' stroke='#7a5c3e' stroke-width='2'/><circle cx='200' cy='170' r='20' fill='none' stroke='#b4561f' stroke-width='2.5'/><text x='200' y='176' text-anchor='middle' font-size='12' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>2026-118</text><text x='200' y='300' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>number painted on bone</text><text x='200' y='322' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>padded cradle in drawer</text><text x='200' y='380' text-anchor='middle' font-size='15' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>one number links it all</text><rect x='420' y='60' width='340' height='100' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='590' y='90' text-anchor='middle' font-size='16' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>label card</text><text x='590' y='116' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>species, site,</text><text x='590' y='138' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>collector, date</text><line x1='380' y1='210' x2='420' y2='110' stroke='#b4561f' stroke-width='3.5' stroke-linecap='round'/><polygon points='420,110 420.5,122.0 411.4,118.4' fill='#b4561f'/><rect x='420' y='180' width='340' height='100' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='590' y='210' text-anchor='middle' font-size='16' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>field records</text><text x='590' y='236' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>quarry map,</text><text x='590' y='258' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>photos in place</text><line x1='380' y1='210' x2='420' y2='230' stroke='#b4561f' stroke-width='3.5' stroke-linecap='round'/><polygon points='420,230 408.0,229.5 412.4,220.7' fill='#b4561f'/><rect x='420' y='300' width='340' height='100' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='590' y='330' text-anchor='middle' font-size='16' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>rock record</text><text x='590' y='356' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>layer name,</text><text x='590' y='378' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>neighbour finds</text><line x1='380' y1='210' x2='420' y2='350' stroke='#b4561f' stroke-width='3.5' stroke-linecap='round'/><polygon points='420,350 412.3,340.8 421.7,338.1' fill='#b4561f'/></svg>