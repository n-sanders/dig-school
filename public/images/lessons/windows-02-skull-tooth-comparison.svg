<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 440' role='img'><title>Dinosaur skull and tooth comparison</title><desc>Theropod slicing skull, hadrosaur beak with grinding battery, and sauropod rake-like peg teeth.</desc><rect x='0' y='0' width='800' height='440' fill='#fbf8f3'/><rect x='15' y='20' width='255' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='142.5' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Theropod</text><ellipse cx='142' cy='200' rx='85' ry='50' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2.5'/><polygon points='152,225 143,252 161,252' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><polygon points='172,225 163,252 181,252' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><polygon points='192,225 183,252 201,252' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><text x='142' y='310' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>deep jaws, curved</text><text x='142' y='332' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>serrated slicers</text><rect x='277' y='20' width='255' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='404.5' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Hadrosaur</text><ellipse cx='404' cy='200' rx='85' ry='50' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2.5'/><polygon points='459,190 499,200 459,212' fill='#d9c39a' stroke='#7a5c3e' stroke-width='2'/><rect x='364' y='205' width='80' height='30' rx='6' fill='#d9c39a' stroke='#7a5c3e' stroke-width='2'/><line x1='384' y1='205' x2='384' y2='235' stroke='#7a5c3e' stroke-width='2'/><line x1='404' y1='205' x2='404' y2='235' stroke='#7a5c3e' stroke-width='2'/><line x1='424' y1='205' x2='424' y2='235' stroke='#7a5c3e' stroke-width='2'/><text x='404' y='310' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>beak + dental battery</text><text x='404' y='332' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>grinding mill inside</text><rect x='539' y='20' width='255' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='666.5' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Sauropod</text><ellipse cx='666' cy='190' rx='70' ry='42' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2.5'/><rect x='696' y='218' width='8' height='30' rx='3' fill='#efe6d4' stroke='#7a5c3e' stroke-width='1.5'/><rect x='708' y='218' width='8' height='30' rx='3' fill='#efe6d4' stroke='#7a5c3e' stroke-width='1.5'/><rect x='720' y='218' width='8' height='30' rx='3' fill='#efe6d4' stroke='#7a5c3e' stroke-width='1.5'/><rect x='732' y='218' width='8' height='30' rx='3' fill='#efe6d4' stroke='#7a5c3e' stroke-width='1.5'/><rect x='744' y='218' width='8' height='30' rx='3' fill='#efe6d4' stroke='#7a5c3e' stroke-width='1.5'/><text x='666' y='310' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>peg teeth at front,</text><text x='666' y='332' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>a garden rake</text></svg>