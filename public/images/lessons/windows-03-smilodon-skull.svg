<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 440' role='img'><title>Saber-toothed cat skull and forelimb build</title><desc>Wide-gaping skull with serrated saber canines beside stocky Smilodon and leaner lion forelimbs.</desc><rect x='0' y='0' width='800' height='440' fill='#fbf8f3'/><rect x='20' y='20' width='480' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='260.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Smilodon skull: built for a deep, precise bite</text><ellipse cx='260' cy='210' rx='130' ry='70' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2.5'/><circle cx='200' cy='195' r='16' fill='none' stroke='#7a5c3e' stroke-width='2.5'/><polygon points='300,250 288,330 312,330' fill='#fff' stroke='#7a5c3e' stroke-width='2.5'/><polygon points='340,250 330,315 352,315' fill='#fff' stroke='#7a5c3e' stroke-width='2.5'/><line x1='300' y1='270' x2='300' y2='315' stroke='#b9c2c7' stroke-width='1.5'/><line x1='150' y1='260' x2='260' y2='330' stroke='#7a5c3e' stroke-width='10' stroke-linecap='round'/><text x='260' y='300' text-anchor='middle' font-size='13' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>jaw opens ~120 deg</text><text x='260' y='150' text-anchor='middle' font-size='14' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>7-inch flattened</text><text x='260' y='172' text-anchor='middle' font-size='14' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>serrated canines</text><rect x='520' y='20' width='260' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='650.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Stocky forelimbs</text><rect x='580' y='140' width='34' height='130' rx='15' fill='#c9a87c' stroke='#5f4630' stroke-width='2.5'/><rect x='660' y='140' width='22' height='130' rx='10' fill='#d8cfc4' stroke='#6b625b' stroke-width='2'/><text x='597' y='310' text-anchor='middle' font-size='14' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Smilodon:</text><text x='597' y='332' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>bear-thick</text><text x='671' y='310' text-anchor='middle' font-size='14' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>lion:</text><text x='671' y='332' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>leaner</text><text x='650' y='380' text-anchor='middle' font-size='13' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>pin prey first,</text><text x='650' y='398' text-anchor='middle' font-size='13' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>then bite the neck</text></svg>