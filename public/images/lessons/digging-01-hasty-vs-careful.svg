<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 480' role='img'><title>Hasty digging versus careful excavation</title><desc>Left: messy rushed hole with broken finds. Right: neat gridded square with small tools and records.</desc><rect x='0' y='0' width='800' height='480' fill='#fbf8f3'/><rect x='20' y='20' width='370' height='440' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='205.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Rushing it</text><text x='205.0' y='68' text-anchor='middle' font-size='13' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>treasure-hunt style</text><rect x='50' y='110' width='310' height='130' rx='8' fill='#9a7b55' stroke='#8a7a68' stroke-width='1.5' /><ellipse cx='205' cy='150' rx='120' ry='45' fill='#5f4630'/><ellipse cx='205' cy='150' rx='80' ry='28' fill='#3c2c1e'/><line x1='320' y1='90' x2='250' y2='170' stroke='#6b5233' stroke-width='8' stroke-linecap='round'/><polygon points='250,170 232,158 244,188' fill='#8a8f96'/><polygon points='90,270 120,262 112,286' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><polygon points='150,278 178,270 168,292' fill='#d98f8f' stroke='#7a3e3e' stroke-width='2'/><text x='205' y='300' text-anchor='middle' font-size='14' fill='#5f4630' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>mixed-up layers</text><text x='205' y='340' text-anchor='middle' font-size='15' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>cracked bone + pottery</text><text x='205' y='362' text-anchor='middle' font-size='15' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>tossed on a dirt pile</text><text x='205' y='410' text-anchor='middle' font-size='17' fill='#b3261e' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>clues destroyed</text><text x='205' y='440' text-anchor='middle' font-size='26' fill='#b3261e' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>✕</text><rect x='410' y='20' width='370' height='440' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='595.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Detective work</text><text x='595.0' y='68' text-anchor='middle' font-size='13' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>slow scientific dig</text><rect x='440' y='110' width='310' height='130' rx='8' fill='#e8d5ae' stroke='#8a7a68' stroke-width='1.5' /><rect x='470' y='130' width='250' height='90' fill='none' stroke='#fff' stroke-width='3' stroke-dasharray='8 5'/><rect x='520' y='166.0' width='120' height='18' rx='9.0' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='524' cy='169.0' r='7.5' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='524' cy='181.0' r='7.5' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='636' cy='169.0' r='7.5' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='636' cy='181.0' r='7.5' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='640' cy='140' r='14' fill='#e8b98a' stroke='#7a5c3e' stroke-width='2'/><rect x='622' y='156' width='36' height='50' rx='10' fill='#7a9cc6' stroke='#3e5a7a' stroke-width='2'/><line x1='628' y1='175' x2='600' y2='185' stroke='#e8b98a' stroke-width='8' stroke-linecap='round'/><polygon points='600,185 588,182 594,194' fill='#8a8f96'/><rect x='690' y='250' width='46' height='30' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><line x1='690' y1='260' x2='736' y2='260' stroke='#6b625b' stroke-width='2'/><line x1='690' y1='268' x2='736' y2='268' stroke='#6b625b' stroke-width='2'/><text x='595' y='300' text-anchor='m