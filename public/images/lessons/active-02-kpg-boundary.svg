<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 460' role='img'><title>Stratigraphic diagram across the end-Cretaceous boundary</title><desc>Rock column split by a dark boundary clay: dinosaurs, ammonites, and mosasaurs below; mammals above.</desc><rect x='0' y='0' width='800' height='460' fill='#fbf8f3'/><rect x='150' y='20' width='500' height='420' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='400.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Across the end-Cretaceous boundary</text><rect x='200' y='90' width='400' height='100' rx='8' fill='#cfd8c9' stroke='#8a7a68' stroke-width='1.5' /><text x='400' y='118' text-anchor='middle' font-size='15' fill='#2f7d4a' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>CENOZOIC layers above</text><text x='400' y='142' text-anchor='middle' font-size='13' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>mammals diversify · birds · flowering plants</text><ellipse cx='300' cy='165' rx='30' ry='14' fill='#8a6f52' stroke='#4a3a28' stroke-width='2'/><line x1='500' y1='175' x2='500' y2='135' stroke='#4e7a45' stroke-width='3'/><line x1='500' y1='168.33333333333334' x2='477.25' y2='156.33333333333334' stroke='#4e7a45' stroke-width='2.5'/><line x1='500' y1='168.33333333333334' x2='522.75' y2='156.33333333333334' stroke='#4e7a45' stroke-width='2.5'/><line x1='500' y1='161.66666666666666' x2='480.5' y2='149.66666666666666' stroke='#4e7a45' stroke-width='2.5'/><line x1='500' y1='161.66666666666666' x2='519.5' y2='149.66666666666666' stroke='#4e7a45' stroke-width='2.5'/><line x1='500' y1='155.0' x2='483.75' y2='143.0' stroke='#4e7a45' stroke-width='2.5'/><line x1='500' y1='155.0' x2='516.25' y2='143.0' stroke='#4e7a45' stroke-width='2.5'/><line x1='500' y1='148.33333333333334' x2='487.0' y2='136.33333333333334' stroke='#4e7a45' stroke-width='2.5'/><line x1='500' y1='148.33333333333334' x2='513.0' y2='136.33333333333334' stroke='#4e7a45' stroke-width='2.5'/><line x1='500' y1='141.66666666666666' x2='490.25' y2='129.66666666666666' stroke='#4e7a45' stroke-width='2.5'/><line x1='500' y1='141.66666666666666' x2='509.75' y2='129.66666666666666' stroke='#4e7a45' stroke-width='2.5'/><rect x='200' y='190' width='400' height='26' rx='8' fill='#3a332e' stroke='#8a7a68' stroke-width='1.5' /><text x='400' y='208' text-anchor='middle' font-size='13' fill='#fff' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>boundary clay: iridium · shocked quartz · fern spike</text><rect x='200' y='216' width='400' height='180' rx='8' fill='#d9c39a' stroke='#8a7a68' stroke-width='1.5' /><text x='400' y='244' text-anchor='middle' font-size='15' fill='#5f4630' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>UPPER CRETACEOUS (Mesozoic) below</text><ellipse cx='260' cy='300' rx='42' ry='24' fill='#6b8a6b' stroke='#2e4a2e' stroke-width='2'/><polygon points='260,276 246,250 274,250' fill='#6b8a6b' stroke='#2e4a2e' stroke-width='2'/><text x='260' y='340' text-anchor='middle' font-size='12' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>T. rex + Triceratops</text><circle cx='420' cy='300' r='24.0' fill='none' stroke='#7a5c3e' stroke-width='2'/><circle cx='420' cy='300' r='17.3' fill='none' stroke='#7a5c3e' stroke-width='2'/><circle cx='420' cy='300' r='11.0' fill='none' stroke='#7a5c3e' stroke-width='2'/><circle cx='420' cy='300' r='5.8' fill='none' stroke='#7a5c3e' stroke-width='2'/><text x='420' y='340' text-anchor='middle' font-size='12' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>ammonite</text><ellipse cx='540' cy='300' rx='40' ry='14' fill='#5f7a8a' stroke='#2e4a5a' stroke-width='2'/><text x='540' y='340' text-anchor='middle' font-size='12' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>mosasaur</text><text x='400' y='380' text-anchor='middle' font-size='13' fill='#b3261e' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>below: present · above: gone</text><text x='75' y='200' text-anchor='middle' font-size='12' fill='#6b625b' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>mammals</text><text x='75' y='300' text-anchor='middle' font-size='12' fill='#6b625b' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>dinosaurs</text><text x='725' y='200' text-anchor='middle' font-size='12' fill='#6b625b' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>grow varied</text><text x='725' y='300' text-anchor='middle' font-size='12' fill='#6b625b' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>stop here</text></svg>