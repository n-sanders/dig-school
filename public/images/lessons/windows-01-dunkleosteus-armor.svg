<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 420' role='img'><title>Annotated skull and thoracic armor of Dunkleosteus</title><desc>Armored head shield with eye ring, jaw blades, and neck hinge; soft rear body noted as rarely preserved.</desc><rect x='0' y='0' width='800' height='420' fill='#fbf8f3'/><rect x='20' y='20' width='760' height='380' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='400.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Dunkleosteus skull + shoulder shield (front third only)</text><ellipse cx='330' cy='220' rx='170' ry='90' fill='#a8927a' stroke='#4a3a28' stroke-width='3'/><polygon points='430,220 520,205 520,235' fill='#efe6d4' stroke='#4a3a28' stroke-width='2.5'/><polygon points='430,250 510,250 510,262' fill='#efe6d4' stroke='#4a3a28' stroke-width='2.5'/><polygon points='520,205 535,198 532,220' fill='#efe6d4' stroke='#4a3a28' stroke-width='2'/><circle cx='330' cy='195' r='24' fill='none' stroke='#2e3a44' stroke-width='5'/><circle cx='330' cy='195' r='10' fill='#2e3a44'/><line x1='210' y1='150' x2='210' y2='290' stroke='#4a3a28' stroke-width='3' stroke-dasharray='8 5'/><text x='210' y='320' text-anchor='middle' font-size='13' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>head-shield hinge</text><text x='330' y='120' text-anchor='middle' font-size='14' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>interlocking armor plates</text><text x='560' y='170' text-anchor='middle' font-size='13' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>self-sharpening</text><text x='560' y='190' text-anchor='middle' font-size='13' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>bony jaw blades</text><text x='330' y='320' text-anchor='middle' font-size='13' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>bony eye ring</text><text x='640' y='300' text-anchor='middle' font-size='13' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>soft cartilage body</text><text x='640' y='322' text-anchor='middle' font-size='13' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>rarely fossilizes</text><line x1='560' y1='200' x2='525' y2='215' stroke='#b4561f' stroke-width='2.5' stroke-linecap='round'/><polygon points='525,215 533.1,206.2 537.0,215.2' fill='#b4561f'/><text x='400' y='372' text-anchor='middle' font-size='14' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>About the length of an adult head and chest - not a 20-foot shark body.</text></svg>