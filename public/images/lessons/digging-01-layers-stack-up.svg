<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 480' role='img'><title>How rock and soil layers stack up</title><desc>Hillside cutaway with topsoil, clay hearth layer, fossil sandstone, and shell limestone, youngest on top.</desc><rect x='0' y='0' width='800' height='480' fill='#fbf8f3'/><rect x='20' y='20' width='620' height='440' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='330.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>A hillside cutaway: younger on top, older below</text><rect x='70' y='150' width='520' height='60' rx='8' fill='#8a9a5b' stroke='#8a7a68' stroke-width='1.5' /><rect x='70' y='210' width='520' height='80' rx='8' fill='#c9a87c' stroke='#8a7a68' stroke-width='1.5' /><rect x='70' y='290' width='520' height='90' rx='8' fill='#d9c39a' stroke='#8a7a68' stroke-width='1.5' /><rect x='70' y='380' width='520' height='60' rx='8' fill='#cfd8c9' stroke='#8a7a68' stroke-width='1.5' /><text x='330' y='185' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Topsoil: grass roots + a modern coin</text><circle cx='520' cy='172' r='9' fill='#c9a227' stroke='#7a5c00' stroke-width='2'/><path d='M120 150 q6 -18 0 -30 M140 150 q-6 -18 0 -30' stroke='#4e7a45' stroke-width='3' fill='none'/><text x='330' y='255' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Clay: stone hearth + cooking-pot pieces</text><rect x='150' y='232' width='70' height='16' rx='4' fill='#8a8f96' stroke='#555' stroke-width='2'/><polygon points='480,250 510,244 502,264' fill='#c96f4a' stroke='#7a3e2a' stroke-width='2'/><rect x='300' y='325.0' width='130' height='20' rx='10.0' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='304' cy='328.3333333333333' r='8.333333333333334' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='304' cy='341.6666666666667' r='8.333333333333334' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='426' cy='328.3333333333333' r='8.333333333333334' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='426' cy='341.6666666666667' r='8.333333333333334' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><text x='330' y='348' text-anchor='middle' font-size='14' fill='#5f4630' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Sandstone: fossil reptile bone</text><circle cx='200' cy='412' r='16.0' fill='none' stroke='#7a5c3e' stroke-width='2'/><circle cx='200' cy='412' r='11.5' fill='none' stroke='#7a5c3e' stroke-width='2'/><circle cx='200' cy='412' r='7.4' fill='none' stroke='#7a5c3e' stroke-width='2'/><circle cx='200' cy='412' r='3.8' fill='none' stroke='#7a5c3e' stroke-width='2'/><circle cx='420' cy='412' r='13.0' fill='none' stroke='#7a5c3e' stroke-width='2'/><circle cx='420' cy='412' r='9.4' fill='none' stroke='#7a5c3e' stroke-width='2'/><circle cx='420' cy='412' r='6.0' fill='none' stroke='#7a5c3e' stroke-width='2'/><circle cx='420' cy='412' r='3.1' fill='none' stroke='#7a5c3e' stroke-width='2'/><text x='330' y='428' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Limestone: ancient seashells</text><line x1='665' y1='400' x2='665' y2='160' stroke='#b4561f' stroke-width='3.5' stroke-linecap='round'/><polygon points='665,160 669.9,171.0 660.1,171.0' fill='#b4561f'/><text x='700' y='240' text-anchor='middle' font-size='13' fill='#6b625b' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>deposited</text><text x='700' y='258' text-anchor='middle' font-size='13' fill='#6b625b' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>later</text><text x='700' y='276' text-anchor='middle' font-size='13' fill='#6b625b' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>(younger)</text><text x='700' y='330' text-anchor='middle' font-size='13' fill='#6b625b' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>deposited</text><text x='700' y='348' text-anchor='middle' font-size='13' fill='#6b625b' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>earlier</text><text x='700' y='366' text-anchor='middle' font-size='13' fill='#6b625b' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>(older)</text></svg>