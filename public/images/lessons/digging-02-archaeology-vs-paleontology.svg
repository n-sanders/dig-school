<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 470' role='img'><title>Archaeology versus paleontology comparison</title><desc>Three rows comparing pottery with shells, arrowhead with tooth, and room foundation with skeleton.</desc><rect x='0' y='0' width='800' height='470' fill='#fbf8f3'/><text x='400' y='45' text-anchor='middle' font-size='22' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Same ground, different evidence</text><text x='215' y='78' text-anchor='middle' font-size='16' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>ARCHAEOLOGY: things people made</text><text x='585' y='78' text-anchor='middle' font-size='16' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>PALEONTOLOGY: fossils of ancient life</text><rect x='20' y='100' width='370' height='108' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><rect x='410' y='100' width='370' height='108' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='205' y='162' text-anchor='middle' font-size='16' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Pottery shard</text><text x='595' y='162' text-anchor='middle' font-size='16' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Brachiopod shell</text><rect x='20' y='218' width='370' height='108' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><rect x='410' y='218' width='370' height='108' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='205' y='280' text-anchor='middle' font-size='16' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Flint arrowhead</text><text x='595' y='280' text-anchor='middle' font-size='16' fill='#2a2522' font-weight='bold' font-family='system-ui