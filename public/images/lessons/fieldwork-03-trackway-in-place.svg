<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 440' role='img'><title>Dinosaur trackway left in place for study</title><desc>Footprint trail across a rock ledge recorded with tape, tripod camera, and notes instead of being cut out.</desc><rect x='0' y='0' width='800' height='440' fill='#fbf8f3'/><rect x='20' y='20' width='760' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='400.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>A trackway is worth more where it lies: map it, do not move it</text><rect x='50' y='110' width='700' height='220' rx='8' fill='#d8cfc4' stroke='#8a7a68' stroke-width='1.5' /><ellipse cx='180.2' cy='156.6' rx='8.1' ry='11.7' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='200.0' cy='156.6' rx='8.1' ry='11.7' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='219.8' cy='156.6' rx='8.1' ry='11.7' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='200' cy='180' rx='18.0' ry='14.4' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='280.2' cy='206.6' rx='8.1' ry='11.7' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='300.0' cy='206.6' rx='8.1' ry='11.7' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='319.8' cy='206.6' rx='8.1' ry='11.7' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='300' cy='230' rx='18.0' ry='14.4' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='380.2' cy='156.6' rx='8.1' ry='11.7' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='400.0' cy='156.6' rx='8.1' ry='11.7' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='419.8' cy='156.6' rx='8.1' ry='11.7' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='400' cy='180' rx='18.0' ry='14.4' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='480.2' cy='206.6' rx='8.1' ry='11.7' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='500.0' cy='206.6' rx='8.1' ry='11.7' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='519.8' cy='206.6' rx='8.1' ry='11.7' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='500' cy='230' rx='18.0' ry='14.4' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='580.2' cy='156.6' rx='8.1' ry='11.7' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='600.0' cy='156.6' rx='8.1' ry='11.7' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='619.8' cy='156.6' rx='8.1' ry='11.7' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='600' cy='180' rx='18.0' ry='14.4' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><line x1='120' y1='300' x2='680' y2='300' stroke='#b4561f' stroke-width='3' stroke-dasharray='10 6'/><text x='400' y='325' text-anchor='middle' font-size='13' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>measuring tape along the trail</text><circle cx='150' cy='200' r='12' fill='#e8b98a' stroke='#7a5c3e' stroke-width='2'/><rect x='136' y='214' width='30' height='40' rx='8' fill='#7a9cc6' stroke='#3e5a6e' stroke-width='2'/><rect x='620' y='120' width='90' height='60' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='665' y='148' text-anchor='middle' font-size='12' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>camera on</text><text x='665' y='164' text-anchor='middle' font-size='12' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>tripod</text><line x1='640' y1='180' x2='630' y2='230' stroke='#555' stroke-width='4'/><line x1='665' y1='180' x2='665' y2='230' stroke='#555' stroke-width='4'/><line x1='690' y1='180' x2='700' y2='230' stroke='#555' stroke-width='4'/><text x='400' y='380' text-anchor='middle' font-size='15' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>photos + molds + 3-D scans; the rock ledge stays put</text></svg>