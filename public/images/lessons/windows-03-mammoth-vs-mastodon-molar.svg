<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 440' role='img'><title>Mammoth molar versus mastodon molar</title><desc>Flat washboard grazing molar with grasses beside cone-cusped browsing molar with twigs.</desc><rect x='0' y='0' width='800' height='440' fill='#fbf8f3'/><rect x='20' y='20' width='375' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='207.5' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Mammoth molar: grazing</text><ellipse cx='207' cy='170' rx='120' ry='45' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2.5'/><line x1='107' y1='132' x2='107' y2='208' stroke='#7a5c3e' stroke-width='4'/><line x1='137' y1='132' x2='137' y2='208' stroke='#7a5c3e' stroke-width='4'/><line x1='167' y1='132' x2='167' y2='208' stroke='#7a5c3e' stroke-width='4'/><line x1='197' y1='132' x2='197' y2='208' stroke='#7a5c3e' stroke-width='4'/><line x1='227' y1='132' x2='227' y2='208' stroke='#7a5c3e' stroke-width='4'/><line x1='257' y1='132' x2='257' y2='208' stroke='#7a5c3e' stroke-width='4'/><line x1='287' y1='132' x2='287' y2='208' stroke='#7a5c3e' stroke-width='4'/><text x='207' y='260' text-anchor='middle' font-size='14' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>flat washboard of</text><text x='207' y='282' text-anchor='middle' font-size='14' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>parallel enamel plates</text><text x='207' y='320' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>grinds gritty steppe grasses</text><text x='207' y='360' text-anchor='middle' font-size='13' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>+ grass icon: tufted stalks</text><path d='M150 390 q4 -22 0 -3