<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 440' role='img'><title>Microscopic view of dinosaur bone soft tissue</title><desc>Bone chip before and after dissolving the mineral, plus a zoomed branching bone cell.</desc><rect x='0' y='0' width='800' height='440' fill='#fbf8f3'/><rect x='20' y='20' width='250' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='145.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>1. Dense bone chip</text><polygon points='60,150 240,150 220,300 80,300' fill='#d9cbb2' stroke='#7a5c3e' stroke-width='2.5'/><circle cx='150' cy='220' r='26' fill='none' stroke='#7a5c3e' stroke-width='2'/><text x='150' y='340' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>T. rex femur</text><text x='150' y='362' text-anchor='middle' font-size='13' fill='#6b625b' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>(MOR 1125)</text><rect x='280' y='20' width='250' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='405.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>2. Mineral dissolved</text><rect x='300' y='150' width='210' height='150' rx='8' fill='#eef3f6' stroke='#8a7a68' stroke-width='1.5' /><path d='M330 260 q20 -60 60 -80 q40 -20 60 -60' stroke='#c96f6f' stroke-width='5' fill='none'/><path d='M350 270 q30 -40 70 -55' stroke='#c96f6f' stroke-width='4' fill='none'/><circle cx='380' cy='210' r='6' fill='#8a2e2e'/><circle cx='395' cy='200' r='6' fill='#8a2e2e'/><circle cx='410' cy='192' r='6' fill='#8a2e2e'/><text x='405' y='330' text-anchor='middle' font-size='14' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>stretchy vessel-like</text><text x='405' y='352' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>tubes + cell-like dots</text><rect x='540' y='20' width='240' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='660.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>3. Bone cell zoom</text><circle cx='660' cy='210' r='30' fill='#e8b9b9' stroke='#8a2e2e' stroke-width='2.5'/><line x1='660' y1='210' x2='615' y2='190' stroke='#8a2e2e' stroke-width='2.5'/><line x1='660' y1='210' x2='705' y2='185' stroke='#8a2e2e' stroke-width='2.5'/><line x1='660' y1='210' x2='620' y2='235' stroke='#8a2e2e' stroke-width='2.5'/><line x1='660' y1='210' x2='702' y2='232' stroke='#8a2e2e' stroke-width='2.5'/><line x1='660' y1='210' x2='660' y2='162' stroke='#8a2e2e' stroke-width='2.5'/><text x='660' y='300' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>osteocyte with</text><text x='660' y='322' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>branching filaments</text><text x='660' y='362' text-anchor='middle' font-size='13' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>snaps back when</text><text x='660' y='382' text-anchor='middle' font-size='13' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>pulled: still flexible</text><line x1='270' y1='225' x2='280' y2='225' stroke='#b4561f' stroke-width='3.5' stroke-linecap='round'/><polygon points='280,225 269.0,229.9 269.0,220.1' fill='#b4561f'/><line x1='530' y1='225' x2='540' y2='225' stroke='#b4561f' stroke-width='3.5' stroke-linecap='round'/><polygon points='540,225 529.0,229.9 529.0,220.1' fill='#b4561f'/></svg>