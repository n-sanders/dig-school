<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 495' role='img'><title>The geologic column with representative fossils</title><desc>Four stacked divisions from Precambrian stromatolites to Cenozoic mammoths, oldest at the base.</desc><rect x='0' y='0' width='800' height='495' fill='#fbf8f3'/><rect x='150' y='20' width='400' height='430' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='350.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>The rock column, bottom to top</text><rect x='180' y='90' width='340' height='80' rx='8' fill='#cfd8c9' stroke='#8a7a68' stroke-width='1.5' /><text x='350' y='120' text-anchor='middle' font-size='15' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>CENOZOIC (top)</text><text x='350' y='145' text-anchor='middle' font-size='12' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>mammoth molar · saber-cat skull · oak leaves</text><rect x='180' y='190' width='340' height='80' rx='8' fill='#e8d5ae' stroke='#8a7a68' stroke-width='1.5' /><text x='350' y='220' text-anchor='middle' font-size='15' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>MESOZOIC</text><text x='350' y='245' text-anchor='middle' font-size='12' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>ammonite · Stegosaurus · cycad leaf</text><rect x='180' y='290' width='340' height='80' rx='8' fill='#d8b98a' stroke='#8a7a68' stroke-width='1.5' /><text x='350' y='320' text-anchor='middle' font-size='15' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>PALEOZOIC</text><text x='350' y='345' text-anchor='middle' font-size='12' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>trilobite · Dunkleosteus · fern frond</text><rect x='180' y='390' width='340' height='80' rx='8' fill='#b9c2c7' stroke='#8a7a68' stroke-width='1.5' /><text x='350' y='420' text-anchor='middle' font-size='15' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>PRECAMBRIAN (base)</text><text x='350' y='445' text-anchor='middle' font-size='12' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>stromatolites · Ediacaran fronds</text><text x='620' y='130' text-anchor='middle' font-size='14' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>youngest</text><line x1='620' y1='150' x2='620' y2='400' stroke='#b4561f' stroke-width='3.5' stroke-linecap='round'/><polygon points='620,400 615.1,389.0 624.9,389.0' fill='#b4561f'/><text x='620' y='432' text-anchor='middle' font-size='14' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>oldest</text><text x='400' y='478' text-anchor='middle' font-size='13' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Order = observed layer sequence. Age numbers are the standard scientific framework.</text></svg>