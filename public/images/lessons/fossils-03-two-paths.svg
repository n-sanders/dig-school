<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 480' role='img'><title>Two paths after death: recycling versus fossilization</title><desc>Branching flowchart from death to decay and recycling on one side and rare burial and fossilization on the other.</desc><rect x='0' y='0' width='800' height='480' fill='#fbf8f3'/><text x='400' y='40' text-anchor='middle' font-size='22' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Two paths after death</text><rect x='300' y='65' width='200' height='50' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='400' y='96' text-anchor='middle' font-size='16' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>An organism dies</text><line x1='400' y1='115' x2='140' y2='150' stroke='#b4561f' stroke-width='3.5' stroke-linecap='round'/><polygon points='140,150 150.2,143.7 151.5,153.4' fill='#b4561f'/><line x1='400' y1='115' x2='660' y2='150' stroke='#b4561f' stroke-width='3.5' stroke-linecap='round'/><polygon points='660,150 648.5,153.4 649.8,143.7' fill='#b4561f'/><rect x='20' y='150' width='240' height='60' rx='8' fill='#fbe6e4' stroke='#b3261e' stroke-width='1.5' /><text x='140' y='172' text-anchor='middle' font-size='15' fill='#b3261e' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>COMMON PATH</text><text x='140' y='194' text-anchor='middle' font-size='13' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>almost all organisms</text><rect x='540' y='150' width='240' height='60' rx='8' fill='#e4f4e9' stroke='#2f7d4a' stroke-width='1.5' /><text x='660' y='172' text-anchor='middle' font-size='15' fill='#2f7d4a' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>RARE PATH</text><text x='660' y='194' text-anchor='middle' font-size='13' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>needs the right conditions</text><rect x='20' y='230' width='240' height='44' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='140' y='258' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Scavengers scatter it</text><line x1='140' y1='274' x2='140' y2='286' stroke='#b3261e' stroke-width='2.5' stroke-linecap='round'/><polygon points='140,286 135.1,275.0 144.9,275.0' fill='#b3261e'/><rect x='20' y='286' width='240' height='44' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='140' y='314' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Bacteria + fungi rot it</text><line x1='140' y1='330' x2='140' y2='342' stroke='#b3261e' stroke-width='2.5' stroke-linecap='round'/><polygon points='140,342 135.1,331.0 144.9,331.0' fill='#b3261e'/><rect x='20' y='342' width='240' height='44' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='140' y='370' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Sun + weather wear it</text><line x1='140' y1='386' x2='140' y2='398' stroke='#b3261e' stroke-width='2.5' stroke-linecap='round'/><polygon points='140,398 135.1,387.0 144.9,387.0' fill='#b3261e'/><rect x='20' y='398' width='240' height='44' rx='8' fill='#fbe6e4' stroke='#b3261e' stroke-width='1.5' /><text x='140' y='426' text-anchor='middle' font-size='14' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Recycled into soil: NO FOSSIL</text><rect x='540' y='230' width='240' height='44' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='660' y='258' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Rapid burial in mud/sand</text><line x1='660' y1='274' x2='660' y2='286' stroke='#2f7d4a' stroke-width='2.5' stroke-linecap='round'/><polygon points='660,286 655.1,275.0 664.9,275.0' fill='#2f7d4a'/><rect x='540' y='286' width='240' height='44' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='660' y='314' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Hidden from air + scavengers</text><line x1='660' y1='330' x2='660' y2='342' stroke='#2f7d4a' stroke-width='2.5' stroke-linecap='round'/><polygon points='660,342 655.1,331.0 664.9,331.0' fill='#2f7d4a'/><rect x='540' y='342' width='240' height='44' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='660' y='370' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Minerals harden it in rock</text><line x1='660' y1='386' x2='660' y2='398' stroke='#2f7d4a' stroke-width='2.5' stroke-linecap='round'/><polygon points='660,398 655.1,387.0 664.9,387.0' fill='#2f7d4a'/><rect x='540' y='398' width='240' height='44' rx='8' fill='#e4f4e9' stroke='#2f7d4a' stroke-width='1.5' /><text x='660' y='426' text-anchor='middle' font-size='14' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Preserved FOSSIL specimen</text></svg>