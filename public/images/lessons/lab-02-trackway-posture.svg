<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 460' role='img'><title>Reading a fossil trackway and limb posture</title><desc>Footprint measurements for stride and stance beside a hind-limb skeleton showing hip height and joint angles.</desc><rect x='0' y='0' width='800' height='460' fill='#fbf8f3'/><rect x='20' y='20' width='400' height='420' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='220.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>The footprints: measurements</text><ellipse cx='99.1' cy='125.3' rx='8.5' ry='12.3' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='120.0' cy='125.3' rx='8.5' ry='12.3' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='140.9' cy='125.3' rx='8.5' ry='12.3' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='120' cy='150' rx='19.0' ry='15.2' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='199.1' cy='175.3' rx='8.5' ry='12.3' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='220.0' cy='175.3' rx='8.5' ry='12.3' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='240.9' cy='175.3' rx='8.5' ry='12.3' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='220' cy='200' rx='19.0' ry='15.2' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='299.1' cy='125.3' rx='8.5' ry='12.3' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='320.0' cy='125.3' rx='8.5' ry='12.3' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='340.9' cy='125.3' rx='8.5' ry='12.3' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><ellipse cx='320' cy='150' rx='19.0' ry='15.2' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><line x1='120' y1='260' x2='220' y2='260' stroke='#3e6e8e' stroke-width='2.5' stroke-linecap='round'/><polygon points='220,260 209.0,264.9 209.0,255.1' fill='#3e6e8e'/><text x='170' y='285' text-anchor='middle' font-size='13' fill='#3e6e8e' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>stride length</text><line x1='320' y1='235' x2='320' y2='300' stroke='#3e6e8e' stroke-width='2.5' stroke-linecap='round'/><polygon points='320,300 315.1,289.0 324.9,289.0' fill='#3e6e8e'/><text x='360' y='275' text-anchor='middle' font-size='12' fill='#3e6e8e' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>foot length</text><text x='220' y='340' text-anchor='middle' font-size='14' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>narrow trail, feet under</text><text x='220' y='362' text-anchor='middle' font-size='14' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>the body, no tail drag</text><text x='220' y='410' text-anchor='middle' font-size='15' fill='#2f7d4a' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>upright walker</text><rect x='440' y='20' width='340' height='420' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='610.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>The leg bone: fit</text><rect x='590' y='110' width='40' height='150' rx='18' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2.5'/><circle cx='610' cy='105' r='22' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2.5'/><ellipse cx='610' cy='275' rx='30' ry='14' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2.5'/><line x1='590' y1='180' x2='540' y2='180' stroke='#3e6e8e' stroke-width='2.5' stroke-linecap='round'/><polygon points='540,180 551.0,175.1 551.0,184.9' fill='#3e6e8e'/><text x='520' y='160' text-anchor='middle' font-size='12' fill='#3e6e8e' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>hip height</text><text x='610' y='330' text-anchor='middle' font-size='