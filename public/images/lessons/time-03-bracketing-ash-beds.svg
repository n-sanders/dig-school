<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 460' role='img'><title>Bracketing a fossil layer between volcanic ash beds</title><desc>Five-layer outcrop with a dinosaur sandstone between two dated ash beds, plus a zircon crystal zoom-in.</desc><rect x='0' y='0' width='800' height='460' fill='#fbf8f3'/><rect x='20' y='20' width='500' height='420' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='270.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Ash beds bracket the fossil layer</text><rect x='60' y='130' width='380' height='48' rx='8' fill='#b9c2c7' stroke='#8a7a68' stroke-width='1.5' /><text x='250' y='158' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>5. Upper shale</text><rect x='60' y='180' width='380' height='42' rx='8' fill='#d8cfc4' stroke='#b4561f' stroke-width='3' /><text x='250' y='208' text-anchor='middle' font-size='14' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>4. ASH BED B (upper)</text><rect x='60' y='250' width='380' height='48' rx='8' fill='#d9c39a' stroke='#8a7a68' stroke-width='1.5' /><text x='250' y='278' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>3. Sandstone + dinosaur skeleton</text><rect x='60' y='330' width='380' height='42' rx='8' fill='#d8cfc4' stroke='#b4561f' stroke-width='3' /><text x='250' y='358' text-anchor='middle' font-size='14' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>2. ASH BED A (lower)</text><rect x='60' y='390' width='380' height='48' rx='8' fill='#c9a87c' stroke='#8a7a68' stroke-width='1.5' /><text x='250' y='418' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>1. Lower mudstone</text><rect x='140' y='267.0' width='110' height='14' rx='7.0' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='144' cy='269.3333333333333' r='5.833333333333334' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='144' cy='278.6666666666667' r='5.833333333333334' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='246' cy='269.3333333333333' r='5.833333333333334' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='246' cy='278.6666666666667' r='5.833333333333334' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><text x='400' y='250' text-anchor='middle' font-size='13' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>younger than A,</text><text x='400' y='268' text-anchor='middle' font-size='13' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>older than B</text><rect x='540' y='20' width='240' height='420' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='660.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Zircon zoom-in</text><polygon points='660,140 690,200 660,260 630,200' fill='#c9a0dc' stroke='#5e3a8a' stroke-width='2.5'/><text x='660' y='300' text-anchor='middle' font-size='13' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>parent atoms</text><text x='660' y='322' text-anchor='middle' font-size='13' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>become daughter</text><text x='660' y='344' text-anchor='middle' font-size='13' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>atoms over time</text><text x='660' y='390' text-anchor='middle' font-size='14' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>lab measures</text><text x='660' y='412' text-anchor='middle' font-size='14' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>each ash bed</text></svg>