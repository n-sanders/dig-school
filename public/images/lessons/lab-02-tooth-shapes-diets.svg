<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 440' role='img'><title>Four fossil tooth shapes and their diets</title><desc>Serrated slicer, conical gripper, peg-like stripper, and ridged grinding battery with magnified biting surfaces.</desc><rect x='0' y='0' width='800' height='440' fill='#fbf8f3'/><rect x='12' y='20' width='188' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='106.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Slicer</text><path d='M106,130 q40,60 4,120 q-30,-55 -30,-90 q0,-25 26,-30' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2.5'/><line x1='118' y1='170' x2='132' y2='170' stroke='#7a5c3e' stroke-width='1.5'/><line x1='118' y1='185' x2='128' y2='185' stroke='#7a5c3e' stroke-width='1.5'/><text x='106' y='300' text-anchor='middle' font-size='13' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>theropod: curved,</text><text x='106' y='322' text-anchor='middle' font-size='13' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>serrated, cuts meat</text><text x='106' y='368' text-anchor='middle' font-size='12' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>see: biting surface</text><rect x='208' y='20' width='188' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='302.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Gripper</text><polygon points='302,125 282,250 322,250' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2.5'/><text x='302' y='300' text-anchor='middle' font-size='13' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>sea reptile: tall cone,</text><text x='302' y='322' text-anchor='middle' font-size='13' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>holds slippery fish</text><text x='302' y='368' text-anchor='middle' font-size='12' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>see: biting surface</text><rect x='404' y='20' width='188' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='498.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Stripper</text><rect x='484' y='130' width='28' height='115' rx='12' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2.5'/><text x='498' y='300' text-anchor='middle' font-size='13' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>sauropod: peg teeth,</text><text x='498' y='322' text-anchor='middle' font-size='13' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>rake leaves off twigs</text><text x='498' y='368' text-anchor='middle' font-size='12' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>see: biting surface</text><rect x='600' y='20' width='188' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='694.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Grinder</text><rect x='649' y='150' width='90' height='80' rx='10' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2.5'/><line x1='672' y1='150' x2='672' y2='230' stroke='#7a5c3e' stroke-width='2'/><line x1='694' y1='150' x2='694' y2='230' stroke='#7a5c3e' stroke-width='2'/><line x1='716' y1='150' x2='716' y2='230' stroke='#7a5c3e' stroke-width='2'/><line x1='649' y1='170' x2='739' y2='170' stroke='#b49b72' stroke-width='1.5'/><line x1='649' y1='190' x2='739' y2='190' stroke='#b49b72' stroke-widt