<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 440' role='img'><title>Skeletal reconstruction bone map</title><desc>Side-view dinosaur skeleton shaded by evidence: original bone, mirrored or second-specimen bone, and missing bone.</desc><rect x='0' y='0' width='800' height='440' fill='#fbf8f3'/><rect x='20' y='20' width='760' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='400.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Bone map: dark = real fossil, tan = mirrored/filled, white = missing</text><ellipse cx='400' cy='250' rx='150' ry='55' fill='#d9c39a' stroke='#7a5c3e' stroke-width='2.5'/><ellipse cx='590' cy='200' rx='55' ry='35' fill='#7a5c3e' stroke='#4a3a28' stroke-width='2.5'/><rect x='620' y='180' width='90' height='28' rx='12' fill='#7a5c3e' stroke='#4a3a28' stroke-width='2'/><rect x='250' y='230' width='110' height='26' rx='12' fill='#fff' stroke='#7a5c3e' stroke-width='2' stroke-dasharray='7 5'/><rect x='300' y='290' width='22' height='70' rx='10' fill='#d9c39a' stroke='#7a5c3e' stroke-width='2'/><rect x='350' y='290' width='22' height='70' rx='10' fill='#d9c39a' stroke='#7a5c3e' stroke-width='2'/><rect x='450' y='290' width='22' height='70' rx='10' fill='#d9c39a' stroke='#7a5c3e' stroke-width='2'/><rect x='500' y='290' width='22' height='70' rx='10' fill='#d9c39a' stroke='#7a5c3e' stroke-width='2'/><rect x='520' y='290' width='22' height='70' rx='10' fill='#fff' stroke='#7a5c3e' stroke-width='2' stroke-dasharray='7 5'/><text x='400' y='150' text-anchor='middle' font-size='14' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>skull + neck (original)</text><text x='300' y='330' text-anchor='middle' font-size='13' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>legs mirrored</text><text x='400' y='340' text-anchor='middle' font-size='13' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>from other side</text><rect x='60' y='350' width='240' height='52' rx='8' fill='#7a5c3e' stroke='#8a7a68' stroke-width='1.5' /><text x='180' y='383' text-anchor='middle' font-size='13' fill='#fff' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>original fossil bone</text><rect x='310' y='350' width='230' height='52' rx='8' fill='#d9c39a' stroke='#8a7a68' stroke-width='1.5' /><text x='425' y='383' text-anchor='middle' font-size='13' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>mirrored / second specimen</text><rect x='550' y='350' width='190' height='52' rx='8' fill='#fff' stroke='#8a7a68' stroke-width='1.5' /><text x='645' y='383' text-anchor='middle' font-size='13' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>still missing</text></svg>