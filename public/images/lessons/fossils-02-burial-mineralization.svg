<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 460' role='img'><title>Four-step burial and mineralization sequence</title><desc>Quick burial, deepening layers, mineral seepage into bone pores, and final exposure by erosion.</desc><rect x='0' y='0' width='800' height='460' fill='#fbf8f3'/><rect x='15' y='20' width='185' height='380' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='107.5' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>1. Quick burial</text><rect x='27' y='110' width='161' height='150' rx='8' fill='#d9c39a' stroke='#8a7a68' stroke-width='1.5' /><ellipse cx='107' cy='200' rx='45' ry='14' fill='#8fa8b8' stroke='#3e5a6e' stroke-width='2'/><circle cx='75' cy='196' r='3' fill='#2a2522'/><text x='107' y='245' text-anchor='middle' font-size='12' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>settling mud</text><text x='107' y='320' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>fish rests on lake floor;</text><text x='107' y='342' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>mud covers it</text><line x1='200' y1='210' x2='228' y2='210' stroke='#b4561f' stroke-width='3.5' stroke-linecap='round'/><polygon points='228,210 217.0,214.9 217.0,205.1' fill='#b4561f'/><rect x='213' y='20' width='185' height='380' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='305.5' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>2. Deep layers</text><rect x='225' y='110' width='161' height='150' rx='8' fill='#d9c39a' stroke='#8a7a68' stroke-width='1.5' /><line x1='225' y1='130' x2='386' y2='130' stroke='#8a7a68' stroke-width='2'/><line x1='225' y1='155' x2='386' y2='155' stroke='#8a7a68' stroke-width='2'/><line x1='225' y1='180' x2='386' y2='180' stroke='#8a7a68' stroke-width='2'/><rect x='253' y='218.0' width='100' height='14' rx='7.0' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='257' cy='220.33333333333334' r='5.833333333333334' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='257' cy='229.66666666666666' r='5.833333333333334' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='349' cy='220.33333333333334' r='5.833333333333334' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='349' cy='229.66666666666666' r='5.833333333333334' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><text x='305' y='320' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>sediment piles up;</text><text x='305' y='342' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>soft parts decay</text><line x1='398' y1='210' x2='426' y2='210' stroke='#b4561f' stroke-width='3.5' stroke-linecap='round'/><polygon points='426,210 415.0,214.9 415.0,205.1' fill='#b4561f'/><rect x='411' y='20' width='185' height='380' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='503.5' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>3. Minerals seep</text><rect x='423' y='110' width='161' height='150' rx='8' fill='#d9c39a' stroke='#8a7a68' stroke-width='1.5' /><rect x='451' y='192.0' width='100' height='16' rx='8.0' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='455' cy='194.66666666666666' r='6.666666666666667' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='455' cy='205.33333333333334' r='6.666666666666667' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='547' cy='194.66666666666666' r='6.666666666666667' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='547' cy='205.33333333333334' r='6.666666666666667' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='481' cy='180' r='5' fill='#6fa8c9' stroke='#3e6e8e' stroke-width='1.5'/><line x1='481' y1='202' x2='481' y2='186' stroke='#3e6e8e' stroke-width='2' stroke-linecap='round'/><polygon points='481,186 485.9,197.0 476.1,197.0' fill='#3e6e8e'/><circle cx='521' cy='170' r='5' fill='#6fa8c9' stroke='#3e6e8e' stroke-width='1.5'/><line x1='521' y1='192' x2='521' y2='176' stroke='#3e6e8e' stroke-width='2' stroke-linecap='round'/><polygon points='521,176 525.9,187.0 516.1,187.0' fill='#3e6e8e'/><circle cx='561' cy='182' r='5' fill='#6fa8c9' stroke='#3e6e8e' stroke-width='1.5'/><line x1='561' y1='204' x2='561' y2='188' stroke='#3e6e8e' stroke-width='2' stroke-linecap='round'/><polygon points='561,188 565.9,199.0 556.1,199.0' fill='#3e6e8e'/><circle cx='501' cy='225' r='5' fill='#6fa8c9' stroke='#3e6e8e' stroke-width='1.5'/><line x1='501' y1='247' x2='501' y2='231' stroke='#3e6e8e' stroke-width='2' stroke-linecap='round'/><polygon points='501,231 505.9,242.0 496.1,242.0' fill='#3e6e8e'/><circle cx='546' cy='230' r='5' fill='#6fa8c9' stroke='#3e6e8e' stroke-width='1.5'/><line x1='546' y1='252' x2='546' y2='236' stroke='#3e6e8e' stroke-width='2' stroke-linecap='round'/><polygon points='546,236 550.9,247.0 541.1,247.0' fill='#3e6e8e'/><text x='503' y='285' text-anchor='middle' font-size='12' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>magnified pores fill</text><text x='503' y='320' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>groundwater fills</text><text x='503' y='342' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>pores with minerals</text><line x1='596' y1='210' x2='624' y2='210' stroke='#b4561f' stroke-width='3.5' stroke-linecap='round'/><polygon points='624,210 613.0,214.9 613.0,205.1' fill='#b4561f'/><rect x='609' y='20' width='185' height='380' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='701.5' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>4. Exposure</text><rect x='621' y='110' width='161' height='150' rx='8' fill='#b9c2c7' stroke='#8a7a68' stroke-width='1.5' /><polygon points='621,260 679,110 739,260' fill='#9a7b55'/><rect x='664' y='208.0' width='80' height='14' rx='7.0' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='668' cy='210.33333333333334' r='5.833333333333334' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='668' cy='219.66666666666666' r='5.833333333333334' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='740' cy='210.33333333333334' r='5.833333333333334' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='740' cy='219.66666666666666' r='5.833333333333334' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><text x='701' y='320' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>erosion reveals</text><text x='701' y='342' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>the fossil again</text><text x='400' y='440' text-anchor='middle' font-size='15' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Soft parts decay; hard bones remain and turn to stone.</text></svg>