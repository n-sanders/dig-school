<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 460' role='img'><title>Prospecting a badlands hillside</title><desc>Layered slope with a fossil in place and a trail of bone scraps leading a prospector uphill to the source.</desc><rect x='0' y='0' width='800' height='460' fill='#fbf8f3'/><rect x='20' y='20' width='760' height='420' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='400.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Follow the float uphill to the source layer</text><polygon points='60,360 60,140 740,100 740,360' fill='#e8d5ae'/><polygon points='60,300 740,262 740,300 60,338' fill='#c9a87c'/><polygon points='60,230 740,192 740,226 60,264' fill='#b9c2c7'/><text x='150' y='170' text-anchor='middle' font-size='13' fill='#6b625b' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>sandstone</text><text x='150' y='250' text-anchor='middle' font-size='13' fill='#6b625b' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>mudstone layer</text><rect x='430' y='240.0' width='90' height='16' rx='8.0' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='434' cy='242.66666666666666' r='6.666666666666667' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='434' cy='253.33333333333334' r='6.666666666666667' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='516' cy='242.66666666666666' r='6.666666666666667' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='516' cy='253.33333333333334' r='6.666666666666667' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><text x='475' y='225' text-anchor='middle' font-size='14' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>fossil still in the layer!</text><rect x='400' y='300' width='14' height='7' rx='2' fill='#efe6d4' stroke='#7a5c3e' stroke-width='1.5'/><rect x='340' y='322' width='12' height='6' rx='2' fill='#efe6d4' stroke='#7a5c3e' stroke-width='1.5'/><rect x='285' y='336' width='10' height='5' rx='2' fill='#efe6d4' stroke='#7a5c3e' stroke-width='1.5'/><rect x='235' y='348' width='8' height='4' rx='2' fill='#efe6d4' stroke='#7a5c3e' stroke-width='1.5'/><text x='300' y='388' text-anchor='middle' font-size='14' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>trail of weathered bone scraps (float) washing downhill</text><circle cx='620' cy='300' r='13' fill='#e8b98a' stroke='#7a5c3e' stroke-width='2'/><rect x='604' y='315' width='32' height='46' rx='9' fill='#7a9cc6' stroke='#3e5a6e' stroke-width='2'/><line x1='620' y1='361' x2='612' y2='392' stroke='#3e5a6e' stroke-width='7' stroke-linecap='round'/><line x1='620' y1='361' x2='630' y2='392' stroke='#3e5a6e' stroke-width='7' stroke-linecap='round'/><rect x='636' y='322' width='26' height='34' rx='8' fill='#a3552f' stroke='#8a7a68' stroke-width='1.5' /><line x1='560' y1='330' x2='480' y2='285' stroke='#8c3f13' stroke-width='3.5' stroke-linecap='round'/><polygon points='480,285 491.9,286.1 487.2,294.6' fill='#8c3f13'/><text x='640' y='260' text-anchor='middle' font-size='14' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>walk uphill,</text><text x='640' y='280' text-anchor='middle' font-size='14' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>eyes on ground</text></svg>