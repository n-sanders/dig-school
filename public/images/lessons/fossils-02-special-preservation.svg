<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 440' role='img'><title>Special preservation: amber, tar, and ice</title><desc>Insect in golden amber, bones in a dark tar seep, and a woolly mammoth calf in permafrost.</desc><rect x='0' y='0' width='800' height='440' fill='#fbf8f3'/><rect x='20' y='20' width='250' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='145.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>A. Amber</text><polygon points='60,150 240,150 220,330 80,330' fill='#e8b93c' stroke='#8a6a00' stroke-width='3'/><ellipse cx='150' cy='245' rx='26' ry='10' fill='#5f4630'/><circle cx='150' cy='238' r='9' fill='#3c2c1e'/><ellipse cx='128' cy='232' rx='14' ry='5' fill='#cfd8dc' opacity='0.8'/><ellipse cx='172' cy='232' rx='14' ry='5' fill='#cfd8dc' opacity='0.8'/><text x='145' y='360' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>insect sealed in</text><text x='145' y='382' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>tree resin</text><rect x='280' y='20' width='250' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='405.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>B. Tar seep</text><rect x='300' y='180' width='210' height='120' rx='8' fill='#3a332e' stroke='#8a7a68' stroke-width='1.5' /><ellipse cx='405' cy='180' rx='105' ry='16' fill='#241f1c'/><rect x='350' y='222.0' width='110' height='16' rx='8.0' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='354' cy='224.66666666666666' r='6.666666666666667' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='354' cy='235.33333333333334' r='6.666666666666667' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='456' cy='224.66666666666666' r='6.666666666666667' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='456' cy='235.33333333333334' r='6.666666666666667' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><text x='405' y='330' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>bones sealed in</text><text x='405' y='352' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>sticky asphalt</text><text x='405' y='382' text-anchor='middle' font-size='13' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>La Brea style</text><rect x='540' y='20' width='240' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='660.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>C. Permafrost</text><rect x='560' y='150' width='200' height='120' rx='8' fill='#cfe0e8' stroke='#8a7a68' stroke-width='1.5' /><line x1='560' y1='190' x2='760' y2='190' stroke='#fff' stroke-width='3'/><ellipse cx='660' cy='235' rx='60' ry='26' fill='#8a6f52' stroke='#5f4630' stroke-width='2'/><path d='M600 235 q-14 26 -6 44 M620 240 q-10 24 -4 42' stroke='#4a3a28' stroke-width='4' fill='none'/><circle cx='705' cy='228' r='4' fill='#2a2522'/><text x='660' y='320' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>mammoth calf frozen</text><text x='660' y='342' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>hair + skin kept</text><text x='660' y='382' text-anchor='middle' font-size='13' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Siberia + Alaska</text></svg>