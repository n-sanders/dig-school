<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 440' role='img'><title>How an asphalt seep captures an entire ecosystem</title><desc>Cutaway of a La Brea style seep trapping a mammoth while predators gather, with tiny fossils preserved below.</desc><rect x='0' y='0' width='800' height='440' fill='#fbf8f3'/><rect x='20' y='20' width='760' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='400.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>One sticky trap, a whole ecosystem</text><rect x='60' y='150' width='680' height='60' rx='8' fill='#a9c8d8' stroke='#8a7a68' stroke-width='1.5' /><text x='400' y='175' text-anchor='middle' font-size='14' fill='#2e4a5a' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>thin water + fallen leaves hide the asphalt</text><rect x='60' y='210' width='680' height='170' rx='8' fill='#3a332e' stroke='#8a7a68' stroke-width='1.5' /><ellipse cx='280' cy='230' rx='70' ry='34' fill='#8a6f52' stroke='#241f1c' stroke-width='2.5'/><path d='M340 225 q30 10 20 45' stroke='#e8e0cc' stroke-width='9' fill='none'/><ellipse cx='500' cy='222' rx='42' ry='20' fill='#6b5a48' stroke='#241f1c' stroke-width='2'/><ellipse cx='620' cy='222' rx='46' ry='22' fill='#75644f' stroke='#241f1c' stroke-width='2'/><polygon points='640,232 634,252 648,252' fill='#fff' stroke='#555' stroke-width='1.5'/><text x='280' y='130' text-anchor='middle' font-size='13' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>trapped mammoth</text><text x='540' y='130' text-anchor='middle' font-size='13' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>dire wolves + Smilodon step in</text><text x='180' y='300' text-anchor='middle' font-size='13' fill='#e8e0cc' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>bones pile up</text><text x='400' y='320' text-anchor='middle' font-size='13' fill='#e8e0cc' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>pine cones · seeds · beetle shells</text><text x='620' y='300' text-anchor='middle' font-size='13' fill='#e8e0cc' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>snails · bird bones</text><circle cx='400' cy='290' r='6' fill='#4e7a45'/><circle cx='430' cy='295' r='4' fill='#c9a227'/><text x='400' y='380' text-anchor='middle' font-size='14' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>cool moist woodland + meadow, Ice Age Los Angeles</text></svg>