<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 440' role='img'><title>How a fossil mold and natural cast form</title><desc>Buried clam shell, dissolved shell leaving a hollow mold, and minerals filling it into a stone cast.</desc><rect x='0' y='0' width='800' height='440' fill='#fbf8f3'/><rect x='20' y='20' width='240' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='140.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Step 1: shell buried</text><rect x='40' y='110' width='200' height='150' rx='8' fill='#d9c39a' stroke='#8a7a68' stroke-width='1.5' /><circle cx='140' cy='185' r='30.0' fill='none' stroke='#4a6b8a' stroke-width='2'/><circle cx='140' cy='185' r='21.6' fill='none' stroke='#4a6b8a' stroke-width='2'/><circle cx='140' cy='185' r='13.8' fill='none' stroke='#4a6b8a' stroke-width='2'/><circle cx='140' cy='185' r='7.2' fill='none' stroke='#4a6b8a' stroke-width='2'/><text x='140' y='310' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>ribbed clam in mud that hardens</text><line x1='260' y1='185' x2='288' y2='185' stroke='#b4561f' stroke-width='3.5' stroke-linecap='round'/><polygon points='288,185 277.0,189.9 277.0,180.1' fill='#b4561f'/><rect x='280' y='20' width='240' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='400.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Step 2: mold</text><rect x='300' y='110' width='200' height='150' rx='8' fill='#d9c39a' stroke='#8a7a68' stroke-width='1.5' /><ellipse cx='400' cy='185' rx='42' ry='30' fill='#5f4630'/><ellipse cx='400' cy='185' rx='34' ry='24' fill='none' stroke='#d9c39a' stroke-width='2'/><ellipse cx='400' cy='185' rx='24' ry='17' fill='none' stroke='#d9c39a' stroke-width='2'/><ellipse cx='400' cy='185' rx='14' ry='10' fill='none' stroke='#d9c39a' stroke-width='2'/><text x='400' y='310' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>shell dissolves</text><text x='400' y='332' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'> hollow impression stays</text><line x1='520' y1='185' x2='548' y2='185' stroke='#b4561f' stroke-width='3.5' stroke-linecap='round'/><polygon points='548,185 537.0,189.9 537.0,180.1' fill='#b4561f'/><rect x='540' y='20' width='240' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='660.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Step 3: cast</text><rect x='560' y='110' width='200' height='150' rx='8' fill='#d9c39a' stroke='#8a7a68' stroke-width='1.5' /><circle cx='660' cy='185' r='30.0' fill='none' stroke='#7a5c3e' stroke-width='2'/><circle cx='660' cy='185' r='21.6' fill='none' stroke='#7a5c3e' stroke-width='2'/><circle cx='660' cy='185' r='13.8' fill='none' stroke='#7a5c3e' stroke-width='2'/><circle cx='660' cy='185' r='7.2' fill='none' stroke='#7a5c3e' stroke-width='2'/><text x='660' y='245' text-anchor='middle' font-size='13' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>solid stone copy</text><text x='660' y='310' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>minerals fill the mold</text><text x='660' y='332' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'> stone copy</text></svg>