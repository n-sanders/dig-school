<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 480' role='img'><title>Field tool progression from overburden to bone</title><desc>Heavy hammers and shovels for barren rock above, fine trowels and brushes within centimetres of the fossil.</desc><rect x='0' y='0' width='800' height='480' fill='#fbf8f3'/><rect x='20' y='20' width='440' height='440' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='240.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Two zones, two tool kits</text><rect x='60' y='110' width='360' height='140' rx='8' fill='#9a7b55' stroke='#8a7a68' stroke-width='1.5' /><text x='240' y='135' text-anchor='middle' font-size='15' fill='#fff' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>BARREN OVERBURDEN</text><text x='240' y='156' text-anchor='middle' font-size='13' fill='#fff' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>30+ cm above the fossil</text><line x1='120' y1='180' x2='90' y2='225' stroke='#6b5233' stroke-width='9' stroke-linecap='round'/><rect x='70' y='222' width='44' height='14' rx='4' fill='#8a8f96' stroke='#555' stroke-width='2'/><text x='110' y='255' text-anchor='middle' font-size='12' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>rock hammer</text><polygon points='220,180 200,225 240,225' fill='#8a8f96' stroke='#555' stroke-width='2'/><line x1='220' y1='180' x2='220' y2='160' stroke='#6b5233' stroke-width='8'/><text x='220' y='255' text-anchor='middle' font-size='12' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>chisel</text><line x1='330' y1='175' x2='300' y2='220' stroke='#6b5233' stroke-width='7' stroke-linecap='round'/><polygon points='300,220 285,212 296,232' fill='#8a8f96'/><text x='322' y='255' text-anchor='middle' font-size='12' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>shovel</text><rect x='60' y='250' width='360' height='160' rx='8' fill='#d9c39a' stroke='#8a7a68' stroke-width='1.5' /><text x='240' y='272' text-anchor='middle' font-size='15' fill='#5f4630' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>FOSSIL ZONE</text><text x='240' y='292' text-anchor='middle' font-size='13' fill='#5f4630' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>within centimetres: small tools only</text><rect x='130' y='337.0' width='120' height='16' rx='8.0' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='134' cy='339.6666666666667' r='6.666666666666667' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='134' cy='350.3333333333333' r='6.666666666666667' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='246' cy='339.6666666666667' r='6.666666666666667' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='246' cy='350.3333333333333' r='6.666666666666667' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><line x1='300' y1='320' x2='285' y2='345' stroke='#c0c6cc' stroke-width='6' stroke-linecap='round'/><text x='305' y='375' text-anchor='middle' font-size='12' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>trowel</text><line x1='350' y1='318' x2='350' y2='348' stroke='#8a6f52' stroke-width='5'/><ellipse cx='350' cy='356' rx='12' ry='7' fill='#d9c39a' stroke='#8a6f52' stroke-width='2'/><text x='350' y='388' text-anchor='middle' font-size='12' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>brush</text><rect x='480' y='20' width='300' height='440' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='630.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>Fine kit</text><rect x='505' y='120' width='250' height='44' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='630' y='148' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>mason's trowel</text><rect x='505' y='176' width='250' height='44' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='630' y='204' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>dental pick</text><rect x='505' y='232' width='250' height='44' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='630' y='260' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>soft brush</text><rect x='505' y='288' width='250' height='44' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='630' y='316' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>consolidant dropper</text><rect x='505' y='344' width='250' height='44' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='630' y='372' text-anchor='middle' font-size='14' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>calipers + scale bar</text><text x='630' y='425' text-anchor='middle' font-size='14' fill='#b3261e' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>heavy tools never</text><text x='630' y='445' text-anchor='middle' font-size='14' fill='#b3261e' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>touch the bone</text></svg>