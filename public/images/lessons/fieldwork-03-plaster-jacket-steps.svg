<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 470' role='img'><title>Five steps of plaster jacketing a fossil</title><desc>Pedestal, separator layer, burlap and plaster, undercut and flip, then seal and label.</desc><rect x='0' y='0' width='800' height='470' fill='#fbf8f3'/><rect x='12' y='20' width='150' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='87.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>1. Pedestal</text><rect x='27' y='120' width='120' height='130' rx='8' fill='#d9c39a' stroke='#8a7a68' stroke-width='1.5' /><rect x='47' y='144.0' width='80' height='12' rx='6.0' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='51' cy='146.0' r='5.0' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='51' cy='154.0' r='5.0' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='123' cy='146.0' r='5.0' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='123' cy='154.0' r='5.0' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><line x1='27' y1='180' x2='147' y2='180' stroke='#5f4630' stroke-width='2'/><text x='87' y='300' text-anchor='middle' font-size='13' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>trench around;</text><text x='87' y='320' text-anchor='middle' font-size='13' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>bone on rock pillar</text><rect x='168' y='20' width='150' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='243.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>2. Separator</text><rect x='183' y='120' width='120' height='130' rx='8' fill='#d9c39a' stroke='#8a7a68' stroke-width='1.5' /><rect x='203' y='144.0' width='80' height='12' rx='6.0' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='207' cy='146.0' r='5.0' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='207' cy='154.0' r='5.0' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='279' cy='146.0' r='5.0' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><circle cx='279' cy='154.0' r='5.0' fill='#efe6d4' stroke='#7a5c3e' stroke-width='2'/><rect x='198' y='138' width='90' height='26' rx='8' fill='#fff' stroke='#8a8f96' stroke-width='1.5' /><text x='243' y='300' text-anchor='middle' font-size='13' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>damp paper over</text><text x='243' y='320' text-anchor='middle' font-size='13' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>the bone surface</text><rect x='324' y='20' width='150' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='399.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>3. Plaster</text><rect x='339' y='120' width='120' height='130' rx='8' fill='#d9c39a' stroke='#8a7a68' stroke-width='1.5' /><rect x='349' y='130' width='100' height='60' rx='8' fill='#fff' stroke='#8a8f96' stroke-width='1.5' /><line x1='349' y1='145' x2='449' y2='145' stroke='#b9c2c7' stroke-width='3'/><line x1='349' y1='160' x2='449' y2='160' stroke='#b9c2c7' stroke-width='3'/><line x1='349' y1='175' x2='449' y2='175' stroke='#b9c2c7' stroke-width='3'/><text x='399' y='300' text-anchor='middle' font-size='13' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>burlap strips in</text><text x='399' y='320' text-anchor='middle' font-size='13' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>plaster, overlapped</text><rect x='480' y='20' width='150' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='555.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>4. Flip</text><rect x='495' y='120' width='120' height='130' rx='8' fill='#d9c39a' stroke='#8a7a68' stroke-width='1.5' /><rect x='505' y='150' width='100' height='60' rx='8' fill='#fff' stroke='#8a8f96' stroke-width='1.5' /><line x1='520' y1='130' x2='590' y2='130' stroke='#b4561f' stroke-width='3.5' stroke-linecap='round'/><polygon points='590,130 579.0,134.9 579.0,125.1' fill='#b4561f'/><text x='555' y='235' text-anchor='middle' font-size='11' fill='#6b625b' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>chisels cut base</text><text x='555' y='300' text-anchor='middle' font-size='13' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>undercut base;</text><text x='555' y='320' text-anchor='middle' font-size='13' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>turn block over</text><rect x='636' y='20' width='150' height='400' rx='8' fill='#ffffff' stroke='#8a7a68' stroke-width='1.5' /><text x='711.0' y='48' text-anchor='middle' font-size='19' fill='#8c3f13' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>5. Seal + label</text><rect x='651' y='120' width='120' height='130' rx='8' fill='#d9c39a' stroke='#8a7a68' stroke-width='1.5' /><rect x='661' y='140' width='100' height='70' rx='8' fill='#fff' stroke='#8a8f96' stroke-width='1.5' /><text x='711' y='168' text-anchor='middle' font-size='12' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>DS-2026-04</text><text x='711' y='188' text-anchor='middle' font-size='12' fill='#2a2522' font-weight='bold' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>N ↑</text><text x='711' y='300' text-anchor='middle' font-size='13' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>plaster shut;</text><text x='711' y='320' text-anchor='middle' font-size='13' fill='#2a2522' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>no. + north arrow</text><text x='400' y='452' text-anchor='middle' font-size='15' fill='#6b625b' font-style='italic' font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'>The jacket holds fossil + rock together for the bumpy ride.</text></svg>